name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete offline build and browser regression suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install dependencies and verify clean setup bootstrap
        run: |
          npm ci
          node --test tests/unit/setup.test.mjs
      - name: Install pinned runtime assets and browsers
        run: |
          npm run setup
          npx playwright install --with-deps chromium webkit
      - name: Build and run quick regression checks
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: |
          npm run build:hosted
          npm run check
          npm test
          npm run test:browser
          npm run test:static
      - name: Build and run complete regression suites
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          npm run build
          npm run test:all
      - name: Preserve browser results and build inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-results
          path: |
            artifacts/tests/
            dist/manifest.json
          if-no-files-found: ignore
          retention-days: 14
